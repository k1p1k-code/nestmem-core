[package]
name = "nestmen-core"
version = "0.0.2"
edition = "2024"
description = "A library that enables structured cache storage in RAM with TTL support"
license = "Apache-2.0"
repository = "https://github.com/k1p1k-code/nestmem-core"
readme = "README.md"
keywords = ["cache", "ttl", "memory", "storage", "in-memory"]

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["rt", "time"], optional = true }
dashmap = { version = "6.2.1" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154" }
enum_dispatch = { version = "0.3.13" }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = ["sync-cleaner"]
sync-cleaner = []
tokio-cleaner = ["dep:tokio"]